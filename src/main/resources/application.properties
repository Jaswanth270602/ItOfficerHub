spring.application.name=ItOfficerHub
# Load .env from project root (use spring.datasource.* keys inside .env)
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver

# Local default: update. On Render set JPA_DDL_AUTO=none (Flyway owns schema — faster cold start).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Vocab Daily APK (outside fat JAR on Render). Local: ./downloads/vocab-daily.apk
app.vocab-daily.apk-path=${VOCAB_DAILY_APK_PATH:downloads/vocab-daily.apk}

# Runs before Hibernate on startup — adds missing columns/tables on Neon/Render
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Must be 0: default baseline 1 skips V1__ migrations on first connect
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# In-memory cache (Caffeine) — see CacheConfig.java for per-cache TTL
spring.cache.type=caffeine

# HikariCP — keep tiny on Render free (override via env). Neon pooler handles multiplexing.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:3}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=120000

server.port=${PORT:8080}
# Fewer Tomcat threads = less stack RAM on 512Mi instances
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:40}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:2}
server.tomcat.accept-count=50
server.tomcat.max-swallow-size=2MB

app.jwt.secret=${JWT_SECRET:ItOfficerHubSuperSecretKeyForJWTTokenGenerationMustBeLongEnough256bits}
app.jwt.expiration-ms=86400000

app.admin.email=${ADMIN_EMAIL:admin@itofficerhub.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=Administrator

# Startup seed: admin user only when missing (no mocks)
app.seed.admin.enabled=${SEED_ADMIN:true}
# One-time: set SEED_WIPE_MOCKS=true to delete ALL mocks/attempts, then set back to false
app.seed.wipe-mocks=${SEED_WIPE_MOCKS:false}

app.exam.cutoff-marks=25

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8080}

# Rate limiting (per client IP per minute) — mitigates brute-force & basic DoS
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH:12}
app.rate-limit.api-write-per-minute=${RATE_LIMIT_WRITE:45}
app.rate-limit.api-read-per-minute=${RATE_LIMIT_READ:100}
app.rate-limit.global-per-minute=${RATE_LIMIT_GLOBAL:180}

# Request size caps (admin JSON imports). Keep modest to avoid RAM spikes on free tier.
server.tomcat.max-http-form-post-size=${MAX_HTTP_POST:5MB}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD:5MB}
spring.codec.max-in-memory-size=2MB
