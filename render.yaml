# Render Blueprint — one Web Service (API + React UI in Docker JAR)
# Set secrets in Render Dashboard after first deploy (see README / DEPLOY.md)

services:
  - type: web
    name: itofficerhub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: JPA_SHOW_SQL
        value: "false"
      # Flyway owns schema — skip Hibernate ddl-auto on Neon (major cold-start speedup)
      - key: JPA_DDL_AUTO
        value: "none"
      - key: VOCAB_DAILY_APK_PATH
        value: "/app/downloads/vocab-daily.apk"
      # Stay under Render free 512Mi (heap + metaspace + threads + native)
      - key: JAVA_TOOL_OPTIONS
        value: "-Xms48m -Xmx180m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=40m -Xss256k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      - key: HIKARI_MAX_POOL
        value: "3"
      - key: HIKARI_MIN_IDLE
        value: "1"
      - key: TOMCAT_MAX_THREADS
        value: "32"
      - key: PORT
        value: "8080"
      - key: CORS_ORIGINS
        value: https://itofficerhub.in,https://www.itofficerhub.in,https://itofficerhub.onrender.com
      - key: VITE_SITE_URL
        value: https://itofficerhub.in
